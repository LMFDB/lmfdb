name: Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev, web ]
  # Runs on main refresh the query tape (see "Query tape" in Development.md);
  # the daily one picks up data edits made between pushes.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      stale_tables:
        description: 'Tables to fetch again for the query tape even if the edit log does not show a change ("all" for everything)'
        default: ''

# Only one Tests run per pull request at a time: a new push supersedes the
# run for the commit it replaces, instead of leaving it to occupy job slots
# to completion.  Every other run (pushes to main/dev/web or any branch) gets
# a group of its own via github.run_id, so it is never canceled: a group
# holds one running and one pending run, and a newly queued run would cancel
# the pending one, skipping a commit whenever pushes land in quick
# succession.  The event name keeps the push and pull_request runs of a
# commit in separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix_prep:
    name: Initial setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Required as the JSON input file needs to be read
      - uses: actions/checkout@v3

      - name: Conditional Build Matrix
        id: set-matrix
        uses: JoshuaTheMiller/conditional-build-matrix@main
        with:
          # Filtering the default input file: '.github/workflows/matrix_includes.json'
          # using JMESPath https://jmespath.org/examples.html
          # Scheduled and manual runs only refresh the query tape, which the
          # proddb shards do not use.
          filter: "[? server == 'devmirror' || ('${{ secrets.LMFDB_CI_ACCESS }}' && '${{ github.event_name }}' != 'schedule' && '${{ github.event_name }}' != 'workflow_dispatch')]"


  test:
    runs-on: ubuntu-latest
    needs: matrix_prep
    # A healthy job finishes well inside half an hour; the slowest green ones
    # observed are around 25 minutes, and that includes building the conda
    # environment on a cache miss.  GitHub's default is six hours, which is long
    # enough for a job stuck on the database to hold a runner all morning -- one
    # recently ran for five and a half.  Fail such a job in an hour instead.
    # Runs recording the query tape get four hours, since a first recording
    # (or stale_tables=all) fetches everything from the rate-limited devmirror.
    timeout-minutes: ${{ github.repository == 'LMFDB/lmfdb' && github.ref == 'refs/heads/main' && matrix.server == 'devmirror' && 240 || 60 }}
    strategy:
      # The devmirror shards share one database.  Bound concurrent jobs so required
      # functional CI does not become an uncontrolled database load test.
      fail-fast: false
      max-parallel: 6
      matrix: ${{fromJson(needs.matrix_prep.outputs.matrix)}}
    name: ${{matrix.server}} ${{matrix.folders}}
    steps:
    - uses: actions/checkout@v3

    - uses: conda-incubator/setup-miniconda@v4
      with:
        # Runner images no longer ship Miniconda (ubuntu-26.04), so download
        # Miniforge; it installs to ~/miniconda3, which the conda cache below names.
        miniforge-version: latest
        activate-environment: lmfdb
        auto-activate: false
        # environment-file: .environment.yml # now we install after cache
        channel-priority: strict
        # IMPORTANT: use-only-tar-bz2: true needs to be set for caching to work properly!
        use-only-tar-bz2: false

    - name: Cache conda
      uses: actions/cache@v3
      id: condacache
      env:
        # Increase this value to reset cache if .environment.yml has not changed
        CACHE_NUMBER: 0
      with:
        path: |
          ~/miniconda3/envs/lmfdb
        key:
          ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
          hashFiles('.environment.yml') }}



    - name: Run install script
      # Only need to run install when deps has been changed
      if: steps.condacache.outputs.cache-hit != 'true'
      run: conda env create -f .environment.yml  || conda env update -f .environment.yml

    - name: Show conda info
      shell: bash -l {0}
      run: |
        conda info
        conda list

    - name: Cache pip
      uses: actions/cache@v3
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: pip stuff
      shell: bash -l {0}
      run: |
        sage -pip install -r requirements.txt
        pip install pyflakes pylint pycodestyle ruff

    - name: checking that we didn't miss any test files
      shell: bash -l {0}
      # If this fails you need to update the file list above and file count
      run: test $(find lmfdb -name 'test_*.py' -or -name '*_test.py' | wc -l) -eq 45

    - name: Config LMFDB to run tests against proddb
      if: matrix.files != 'lint' && matrix.server == 'proddb'
      env:
        LMFDB_CI_ACCESS: ${{ secrets.LMFDB_CI_ACCESS }}
      shell: bash -l {0}
      run: |
        sage -python lmfdb/utils/config.py  --postgresql-host proddb.lmfdb.xyz  --postgresql-pass "$LMFDB_CI_ACCESS"

    - name: Fetch the query tape
      if: matrix.files != 'lint' && matrix.server == 'devmirror'
      shell: bash
      env:
        RECORD: ${{ github.repository == 'LMFDB/lmfdb' && github.ref == 'refs/heads/main' }}
        STALE_TABLES: ${{ inputs.stale_tables }}
      run: |
        url=https://github.com/LMFDB/lmfdb/releases/download/ci-dbtape/dbtape.sqlite.gz
        code=$(curl -sSL --retry 3 -o dbtape.sqlite.gz -w '%{http_code}' "$url") || true
        if [ "$code" = 200 ] && gunzip -f dbtape.sqlite.gz; then
          echo "DBTAPE_FILE=$PWD/dbtape.sqlite" >> "$GITHUB_ENV"
        else
          rm -f dbtape.sqlite dbtape.sqlite.gz
          # A shard recording without the tape picks its own seed, and the
          # shards' tapes then cannot be merged.  404 means there is no tape yet.
          if [ "$RECORD" = true ] && [ "$code" != 404 ]; then
            echo "::error::Could not fetch the query tape (HTTP $code), so this shard cannot record"
            exit 1
          fi
          echo "::warning::Could not fetch the query tape, so every query goes to devmirror"
        fi
        if [ "$RECORD" = true ]; then
          echo "DBTAPE_MODE=record" >> "$GITHUB_ENV"
          echo "DBTAPE_OUT=$PWD/dbtape-out" >> "$GITHUB_ENV"
          echo "DBTAPE_SEED=${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "DBTAPE_STALE=$STALE_TABLES" >> "$GITHUB_ENV"
        else
          echo "DBTAPE_MODE=replay" >> "$GITHUB_ENV"
        fi
        echo "DBTAPE_MISSLOG=$PWD/dbtape-log.txt" >> "$GITHUB_ENV"

    - name: Run LMFDB tests
      if: matrix.files != 'lint'
      shell: bash -l {0}
      run: tox -e tests -- ${{ matrix.files}}

    # The published tape keeps only results some shard used, so a shard missing
    # a test file's tape would drop that file's results.  Upload nothing then
    # (nor after a timeout), and the publishing job keeps the old tape.  A test
    # file's tape only appears once its tests have run, whether or not they
    # passed: collection errors, interruptions and crashes leave a .part file.
    - name: Check that every test file recorded a tape
      if: (success() || failure()) && env.DBTAPE_MODE == 'record'
      id: recorded
      shell: bash
      run: |
        want=$(wc -w <<< "${{ matrix.files }}")
        have=$(ls dbtape-out/*.sqlite 2> /dev/null | wc -l)
        if [ "$have" -eq "$want" ]; then
          echo "complete=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Only $have of $want test files recorded a query tape, so this shard's is not uploaded"
        fi

    - name: Upload the recorded query tape
      if: (success() || failure()) && steps.recorded.outputs.complete == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dbtape-${{ strategy.job-index }}
        path: dbtape-out
        retention-days: 3

    - name: Upload the list of queries not served from the tape
      if: always() && env.DBTAPE_MODE != ''
      uses: actions/upload-artifact@v4
      with:
        name: dbtape-log-${{ strategy.job-index }}
        path: dbtape-log.txt
        if-no-files-found: ignore
        retention-days: 7


    - name: Run linting
      if: matrix.files == 'lint'
      shell: bash -l {0}
      run: tox -e lint


  publish-tape:
    name: Publish the query tape
    needs: [matrix_prep, test]
    # Test failures do not stop publication: the tape records what the data is,
    # and a failure caused by the data should show up in replays too.
    if: always() && needs.matrix_prep.result == 'success' && github.repository == 'LMFDB/lmfdb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dbtape-publish
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: dbtape-[0-9]*
        path: tapes

    - name: Merge the shards' tapes and publish the result
      env:
        GH_TOKEN: ${{ github.token }}
        MATRIX: ${{ needs.matrix_prep.outputs.matrix }}
      run: |
        # Each shard's tapes hold only the results its tests used, so a missing
        # shard would drop that shard's results; keep the old tape instead.
        expected=$(jq '[(.include // .)[] | select(.server == "devmirror" and .files != "lint")] | length' <<< "$MATRIX")
        found=$(ls -d tapes/*/ 2> /dev/null | wc -l)
        if [ "$found" -ne "$expected" ]; then
          echo "::warning::Only $found of $expected shards recorded a tape, so the published one is unchanged"
          exit 0
        fi
        python3 conftest.py merge dbtape.sqlite tapes/*/*.sqlite
        { echo '```'; python3 conftest.py describe dbtape.sqlite; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        # Runs overlap, and this one's results for queries it did not refetch
        # come from the tape it started with.  If another run has published
        # since, keep that tape rather than going back to older results.
        meta() { python3 conftest.py describe "$1" | sed -n "s/^$2: //p"; }
        url=https://github.com/LMFDB/lmfdb/releases/download/ci-dbtape/dbtape.sqlite.gz
        code=$(curl -sSL --retry 3 -o published.sqlite.gz -w '%{http_code}' "$url") || true
        if [ "$code" = 200 ]; then
          gunzip -f published.sqlite.gz
          if [ "$(meta published.sqlite format)" = "$(meta dbtape.sqlite format)" ] &&
             [ "$(meta published.sqlite created)" != "$(meta dbtape.sqlite base)" ]; then
            echo "::warning::Another run published a tape while this one was recording, so that one is kept"
            exit 0
          fi
        elif [ "$code" != 404 ]; then
          echo "::error::Could not fetch the published tape (HTTP $code) to check it is still the one this run started from"
          exit 1
        fi
        gzip -9 dbtape.sqlite
        if ! gh release view ci-dbtape > /dev/null 2>&1; then
          gh release create ci-dbtape --prerelease --latest=false --title "CI query tape" \
            --notes "Database results replayed by the Tests workflow, replaced on every run on main. See \"Query tape\" in Development.md."
        fi
        gh release upload ci-dbtape dbtape.sqlite.gz --clobber
