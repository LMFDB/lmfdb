name: 'Snippet Setup'
description: 'Set up LMFDB environment for generating snippets'
    
runs:
  using: 'composite'
  steps:
  - uses: conda-incubator/setup-miniconda@v2
    with:
      activate-environment: lmfdb
      auto-activate-base: false
      # environment-file: .environment.yml # now we install after cache
      channel-priority: strict
      # IMPORTANT: use-only-tar-bz2: true needs to be set for caching to work properly!
      use-only-tar-bz2: false

  - name: Cache conda
    uses: actions/cache@v3
    id: condacache
    env:
      # Increase this value to reset cache if .environment.yml has not changed
      CACHE_NUMBER: 0
    with:
      path: |
        /usr/share/miniconda/envs/lmfdb
      key:
        ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
        hashFiles('.environment.yml') }}

  - name: Install Julia
    uses: julia-actions/setup-julia@v2
    with:
      version: '1'          # latest version

  - name: Load Julia packages from cache
    id: julia-cache
    uses: julia-actions/cache@v2      

  - name: Install Oscar
    shell: bash -l {0}
    run: |
      julia -e 'using Pkg; Pkg.add(["Oscar", "GAP"]); using Oscar'

  - name: Run install script
    shell: bash -l {0}
    # Only need to run install when deps has been changed
    if: steps.condacache.outputs.cache-hit != 'true'
    run: conda env create -f .environment.yml  || conda env update -f .environment.yml

  - name: Show conda info
    shell: bash -l {0}
    run: |
      conda info
      conda list

  - name: Cache pip
    uses: actions/cache@v3
    with:
      # This path is specific to Ubuntu
      path: ~/.cache/pip
      # Look to see if there is a cache hit for the corresponding requirements file
      key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-
        ${{ runner.os }}-

  - name: pip stuff
    shell: bash -l {0}
    run: |
      sage -pip install -r requirements.txt

  # The degree 32 transitive groups are needed for the code snippets "TransitiveGroup(32, t)".
  # They are a supplementary download for GAP's transgrp package (~300MB, ~1.3GB unpacked).
  # See https://github.com/LMFDB/lmfdb/issues/7108.

  - name: Cache the degree 32 transitive groups
    uses: actions/cache@v3
    with:
      path: ~/.cache/transgrp
      key: ${{ runner.os }}-trans32-0   # bump the trailing number to force a re-download

  - name: Install the degree 32 transitive groups
    shell: bash -leo pipefail {0}
    run: |
      if [ ! -d ~/.cache/transgrp/dat32 ]; then
        mkdir -p ~/.cache/transgrp
        curl -sSL https://www.math.colostate.edu/~hulpke/transgrp/trans32.tgz | tar xz -C /tmp
        mv "$(find /tmp -type d -name dat32 -print -quit)" ~/.cache/transgrp/
      fi
      shopt -s nullglob
      dirs=("$CONDA_PREFIX"/{lib,share}/gap/pkg/transgrp*/ "$(julia -e 'using GAP
        print(String(GAP.Globals.GAPInfo.PackagesInfo.transgrp[1].InstallationPath))' | tail -n 1 | tr -d '[:space:]')")
      [ ${#dirs[@]} -eq 2 ]   # one conda dir + one Julia artifact dir
      for d in "${dirs[@]}"; do
        chmod u+w "$d"        # Julia marks artifact directories read-only
        ln -sfn ~/.cache/transgrp/dat32 "$d/dat32"
      done
