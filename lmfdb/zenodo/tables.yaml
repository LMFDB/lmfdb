# Which production tables are archived on Zenodo, and by whom.
#
# STATUS: owners and inclusion from the managing editors' owner list of
# 2026-11-16, with the remaining tables decided the same day.
#
# Semantics per entry:
#   backup:  yes | no | hold | review
#            hold == yes once the issues in the note are fixed; until then
#            skipped by pushes and the backfill, and reported (like review)
#   owner:   Zenodo account that owns the table's record: a key of the
#            [tokens] section of ~/.lmfdb_zenodo.ini (sticky once the first
#            version is published; [zenodo] default_owner when absent here)
#   overage: from the owner list, the size above Zenodo's free 50 GB per
#            record, which the owner covers from their account's 150 GB
#   note:    free text
#
# Owner keys: costa = Edgar Costa, cremona = John Cremona, jones = John
# Jones, paulhus = Jen Paulhus, roe = David Roe, sutherland = Drew Sutherland.
#
# Tables that appear in a dump folder (or in db.tablenames) but not here are
# reported by dry runs and by zenodo_audit as needing classification.
#
# The knowl database and the version registry always get records (they are
# not search tables and are not listed here).

