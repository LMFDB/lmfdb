# Which production tables are archived on Zenodo, and by whom.
#
# STATUS: TENTATIVE -- generated 2026-07-18 from the production table list;
# the include/exclude decisions below must be finalized by the managing
# editors before any uploads happen.  In particular the `review` entries
# (suspected alpha-serving, legacy, or regenerable tables) are treated the
# same as `no` until they are resolved to yes/no.
#
# Semantics per entry:
#   backup: yes | no | review    (review == not backed up, but reported)
#   owner:  Zenodo account that owns the table's record (sticky once the
#           first version is published; assigned from [zenodo] default_owner
#           in the local config when absent here)
#   note:   free text
#
# Tables that appear in a dump folder (or in db.tablenames) but not here are
# reported by dry runs and by zenodo_audit as needing classification.
#
# The knowl database and the version registry always get records (they are
# not search tables and are not listed here).

