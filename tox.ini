[tox]
envlist = tests, lint
skipsdist = True

[testenv:tests]

allowlist_externals =
    sage
    parallel

passenv =
    SAGE_ROOT
    SAGE_LOCAL
    HOME

# Bound how long a single database query may run.  The suite talks to a shared
# server (devmirror by default) that has no statement_timeout of its own, and
# psycodict only hands one to connections made as the "webserver" role, so a
# pathological query otherwise runs unbounded: a Dirichlet character search that
# takes seconds on an idle server has held a CI job for over five hours.
#
# libpq reads PGOPTIONS when it opens a connection, including the ones psycodict
# opens when it resets a broken one, so this needs no cooperation from the test
# harness and cannot be lost on a reconnect.  A query stopped this way raises
# the same QueryCanceledError the search pages already handle, so a slow search
# renders the usual timeout page instead of hanging.
#
# This is a hang catcher, not a normal query-performance budget.  Ten minutes
# leaves headroom for transient load on the shared test database while still
# sitting well below the 26-minute-to-multi-hour hangs that motivated it; the
# job-level timeout-minutes in .github/workflows/python-package.yml remains
# the final backstop.  Export PGOPTIONS to override, e.g.
# PGOPTIONS='-c statement_timeout=0' for unbounded statements.
setenv =
    PGOPTIONS = {env:PGOPTIONS:-c statement_timeout=10min}

commands =
    parallel --group 'echo "Running test on {}"; sage -python -m pytest -vv --durations=0 {}' ::: {posargs}

[testenv:lint]
allowlist_externals =
    pyflakes
    pylint
    ruff

commands =
    pyflakes start-lmfdb.py	user-manager.py lmfdb/
    pylint --score=no -d C,R,E,W -e W0129,W0108 start-lmfdb.py user-manager.py lmfdb/
    # see https://pycodequ.al/docs/pylint-messages/Warnings.html
    # E722 do not use bare except, specify exception instead (requires author input)
    # Styling issues now handled by autopep8 workflow instead of ruff linter
    ruff check --preview --select=E722 lmfdb/
